<!DOCTYPE html>

    <title>Пример использования figure</title>

<body>

    <figure>
        <figcaption>Листинг 1 — Пример кода на JavaScript</figcaption>

console.log("Привет, мир!");
        </code></pre>
    </figure>

</body>
