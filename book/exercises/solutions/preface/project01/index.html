<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модальное окно подтверждения</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Кнопка для открытия модального окна -->
    <button id="openBtn">Удалить профиль</button>

    <!-- Модальное окно -->
    <dialog id="confirmDialog">
        <form method="dialog">
            <h3>Подтверждение действия</h3>
            <p>Вы действительно хотите удалить свой профиль? Это действие необратимо.</p>
            
            <div class="dialog-actions">
                <!-- Кнопка отмены с value="cancel" -->
                <button value="cancel" class="btn-cancel">Отмена</button>
                <!-- Кнопка подтверждения с value="confirm" -->
                <button value="confirm" class="btn-confirm">Подтвердить</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
